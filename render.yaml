# Render Blueprint for T20 Dynasty.
# Deploys the stateless AI service and the stateful backend. The frontend stays on Vercel.
# See DEPLOYMENT.md for the full guide and verification steps.
#
# NOTE: the backend has a persistent disk, so it requires a paid plan.
# For a throwaway demo you can set `plan: free` and remove the `disk` block,
# but the auction state will be lost on every deploy/restart.
services:
  - type: web
    name: t20-dynasty-ai
    runtime: python
    plan: free
    rootDir: ai
    region: oregon
    buildCommand: 'echo "No third-party Python dependencies"'
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      # PORT is injected by Render; server.py prefers it over AI_PORT.

  - type: web
    name: t20-dynasty-backend
    runtime: node
    plan: starter
    rootDir: backend
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: AI_URL
        value: https://t20-dynasty-ai.onrender.com
      - key: SAVE_FILE
        value: /var/data/auction-state.json
      - key: ALLOWED_ORIGINS
        value: https://t20-dynasty.indevs.in,https://t20-dynasty.vercel.app
      # PORT is injected by Render; backend/server.js already reads it.
    disk:
      name: t20-dynasty-state
      mountPath: /var/data
      sizeGB: 1
